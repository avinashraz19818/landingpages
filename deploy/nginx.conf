# =====================================================================
#  Nginx reverse proxy — 0-Fake-Click Meta -> Telegram System
#  deploy/nginx.conf
#
#  IMPORTANT: replace __DOMAIN__ with your real domain, e.g.
#      sed -i 's/__DOMAIN__/yourdomain.com/g' deploy/nginx.conf
#  (deploy/setup-vps.sh does this automatically)
# =====================================================================

# --- Upstream Node.js app (PM2) ---
upstream zero_fake_click {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- Rate limit for the public link generator (anti-abuse) ---
limit_req_zone $binary_remote_addr zone=genlink:10m rate=10r/s;

# --- Correct Connection header handling (avoids sending an empty Upgrade) ---
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# =====================================================================
#  HTTP  ->  HTTPS redirect  (+ Let's Encrypt challenge path)
# =====================================================================
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    # certbot webroot challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# =====================================================================
#  HTTPS main server
# =====================================================================
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ www.__DOMAIN__;

    # --- SSL (certbot will manage these lines) ---
    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # --- Security headers ---
    add_header X-Frame-Options          "SAMEORIGIN"  always;
    add_header X-Content-Type-Options   "nosniff"     always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Avatar uploads need a body-size allowance
    client_max_body_size 10M;

    # Gzip (never gzip text/event-stream — it breaks SSE)
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    access_log /var/log/nginx/__DOMAIN__.access.log;
    error_log  /var/log/nginx/__DOMAIN__.error.log warn;

    # -----------------------------------------------------------------
    #  SSE realtime dashboard feed
    #  MUST have buffering OFF and a long read timeout, otherwise the
    #  live counter / activity feed in /admin will hang or disconnect.
    # -----------------------------------------------------------------
    location = /api/admin/events-stream {
        proxy_pass http://zero_fake_click;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';

        # Kill all buffering / caching for the event stream
        proxy_buffering        off;
        proxy_cache            off;
        proxy_request_buffering off;
        chunked_transfer_encoding on;

        # Keep the stream alive up to 1 hour of silence
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        add_header X-Accel-Buffering no;
    }

    # -----------------------------------------------------------------
    #  Telegram webhook
    #  Telegram expects a fast 200. Keep timeouts generous but bounded.
    # -----------------------------------------------------------------
    location = /api/telegram-webhook {
        proxy_pass http://zero_fake_click;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
        client_max_body_size 1M;
    }

    # -----------------------------------------------------------------
    #  Public link generator — rate limited (bots hammer this endpoint)
    # -----------------------------------------------------------------
    location = /api/generate-link {
        limit_req zone=genlink burst=20 nodelay;

        proxy_pass http://zero_fake_click;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------------
    #  Everything else (landing page, admin dashboard, all other APIs)
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://zero_fake_click;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets served straight from disk (faster, skips Node).
    # Uses `root` (not `alias`) so try_files resolves predictably.
    location ~* ^/(css|js|previews|uploads)/ {
        root /opt/app/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @node;
    }

    location @node {
        proxy_pass http://zero_fake_click;
        proxy_set_header Host $host;
    }
}
