# =====================================================================
#  Per-client Nginx vhost template
#  deploy/client-nginx.conf
#
#  add-client.sh replaces these placeholders and installs the result to
#  /etc/nginx/sites-available/zfc-__SLUG__.conf
#
#    __SLUG__     client id            e.g. ree
#    __DOMAIN__   primary domain       e.g. sureshotree.com
#    __ALIASES__  extra server_names   e.g. www.sureshotree.com
#    __PORT__     internal Node port   e.g. 3001
#    __APPDIR__   app directory        e.g. /opt/zfc-clients/ree
# =====================================================================

upstream zfc___SLUG__ {
    server 127.0.0.1:__PORT__;
    keepalive 16;
}

# ---- HTTP -> HTTPS (+ Let's Encrypt challenge) ----
server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ __ALIASES__;

    location /.well-known/acme-challenge/ { root /var/www/certbot; }

    location / { return 301 https://__DOMAIN__$request_uri; }
}

# ---- HTTPS ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__ __ALIASES__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL___SLUG__:5m;

    add_header X-Frame-Options           "SAMEORIGIN" always;
    add_header X-Content-Type-Options    "nosniff"    always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    client_max_body_size 10M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    access_log /var/log/nginx/zfc-__SLUG__.access.log;
    error_log  /var/log/nginx/zfc-__SLUG__.error.log warn;

    # -----------------------------------------------------------------
    #  SSE realtime dashboard feed — buffering MUST stay off or the
    #  live counters in /admin freeze and disconnect.
    # -----------------------------------------------------------------
    location = /api/admin/events-stream {
        proxy_pass http://zfc___SLUG__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        '';
        proxy_buffering        off;
        proxy_cache            off;
        proxy_request_buffering off;
        proxy_read_timeout     3600s;
        proxy_send_timeout     3600s;
    }

    # -----------------------------------------------------------------
    #  Telegram webhook — Telegram needs a fast 200.
    # -----------------------------------------------------------------
    location = /api/telegram-webhook {
        proxy_pass http://zfc___SLUG__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 1M;
    }

    # -----------------------------------------------------------------
    #  Public link generator — rate limited per visitor IP.
    #  Raise the burst if a client runs high-spend ads.
    # -----------------------------------------------------------------
    location = /api/generate-link {
        limit_req zone=zfc_genlink burst=30 nodelay;
        proxy_pass http://zfc___SLUG__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # -----------------------------------------------------------------
    #  Everything else
    # -----------------------------------------------------------------
    location / {
        proxy_pass http://zfc___SLUG__;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # Static assets straight from disk, skipping Node
    location ~* ^/(css|js|previews|uploads)/ {
        root __APPDIR__/public;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        try_files $uri @zfc___SLUG___node;
    }

    location @zfc___SLUG___node {
        proxy_pass http://zfc___SLUG__;
        proxy_set_header Host $host;
    }
}
