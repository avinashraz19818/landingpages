# =====================================================================
#  Shared Nginx config for ALL clients
#  Installs to /etc/nginx/conf.d/zfc.conf  (http context)
#
#  This must exist BEFORE any per-client vhost, because the vhosts
#  reference the zfc_genlink rate-limit zone declared here.
# =====================================================================

# Per-visitor rate limit for the public link generator.
# 10 req/s with a burst of 30 is comfortable for high-spend Meta ads;
# it only stops scripted abuse, not real ad traffic.
limit_req_zone $binary_remote_addr zone=zfc_genlink:20m rate=10r/s;

# Keep many idle upstream connections alive across all client instances
# so Nginx is not opening a new TCP socket per request.
keepalive_timeout 65;

# One shared bucket is enough; per-client upstreams are declared in
# /etc/nginx/sites-available/zfc-<slug>.conf
